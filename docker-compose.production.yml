services:
  web:
    image: ghcr.io/hidayattt24/dsmes-web:${WEB_TAG:?WEB_TAG is required}
    container_name: dsmes_web
    restart: unless-stopped
    ports:
      # Bound to localhost only. Accessible via Nginx reverse proxy.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
